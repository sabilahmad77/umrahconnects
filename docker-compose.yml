# Umrah Connects — Local Development Stack (developer machines only; production is infrastructure/kvm/)
#   cp .env.docker.example .env      # once: local-only passwords (the stack refuses to start without them)
#   pnpm docker:up                   # docker compose up -d
#   pnpm docker:down
# Every port is published on 127.0.0.1 only, so nothing here is reachable from the network, and no password is
# written in this file. The values in .env.docker.example are for this machine only — never reuse them.

services:
  # ─── PostgreSQL 16 ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: uc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: umrah_connects
      POSTGRES_USER: umrah
      POSTGRES_PASSWORD: ${UC_DEV_POSTGRES_PASSWORD:?set UC_DEV_POSTGRES_PASSWORD in .env (cp .env.docker.example .env)}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umrah -d umrah_connects']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: uc_redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${UC_DEV_REDIS_PASSWORD:?set UC_DEV_REDIS_PASSWORD in .env (cp .env.docker.example .env)}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka (KRaft mode, no Zookeeper) ─────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: uc_kafka
    restart: unless-stopped
    ports:
      - '127.0.0.1:9092:9092'
      - '127.0.0.1:9093:9093'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Kafka UI ───────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: uc_kafka_ui
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ─── MinIO (S3-compatible object storage) ──────────────────
  minio:
    image: minio/minio:latest
    container_name: uc_minio
    restart: unless-stopped
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: ${UC_DEV_MINIO_ROOT_USER:-uc-dev-minio}
      MINIO_ROOT_PASSWORD: ${UC_DEV_MINIO_ROOT_PASSWORD:?set UC_DEV_MINIO_ROOT_PASSWORD in .env (cp .env.docker.example .env)}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 20s
      retries: 3

  # ─── Mailhog (local SMTP) ──────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: uc_mailhog
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'   # SMTP
      - '127.0.0.1:8025:8025'   # Web UI

  # ─── pgAdmin (optional, DB management UI) ─────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: uc_pgadmin
    restart: unless-stopped
    ports:
      - '127.0.0.1:5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@umrahconnects.local
      PGADMIN_DEFAULT_PASSWORD: ${UC_DEV_PGADMIN_PASSWORD:?set UC_DEV_PGADMIN_PASSWORD in .env (cp .env.docker.example .env)}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
  pgadmin_data:

networks:
  default:
    name: umrah_connects_network
