# DEPRECATED — Render is the legacy API host (unresponsive since 2026-08-22, AUD-001).
# The target backend host is Hostinger KVM 8: see infrastructure/kvm/README.md.
# Kept until the KVM cutover is complete. NOTE: this branch's API refuses to start in
# production with CORS_ORIGINS="*", a localhost WEB_URL, the sandbox payment provider or
# ephemeral local storage, so this blueprint only works with the values below plus R2.
# Render Blueprint for the Umrah Connect API (backend only).
# In Render: New → Blueprint → connect the GitHub repo → it reads this file.
# The database is provisioned separately on Neon (free) — paste its URL into
# DATABASE_URL below (sync: false means Render will prompt you for the value).
services:
  - type: web
    name: umrah-connect-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false          # paste your Neon connection string in the dashboard
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong secret
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: "https://umrahconnect.io,https://www.umrahconnect.io"
      - key: WEB_URL
        value: "https://umrahconnect.io"
      - key: STORAGE_DRIVER
        value: r2
      - key: PAYMENT_PROVIDER
        value: stripe
      - key: KAFKA_ENABLED
        value: "false"
