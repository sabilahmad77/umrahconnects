# Umrah Connect — Hostinger KVM 8 production stack (API + PostgreSQL + HTTPS proxy)
#
#   cp .env.production.example .env.production   # fill in values on the server only
#   docker compose --env-file .env.production pull | build
#   docker compose --env-file .env.production run --rm api migrate
#   docker compose --env-file .env.production up -d
#
# Only Caddy publishes ports (80/443). PostgreSQL and the API are reachable
# only on the internal network (and PostgreSQL on 127.0.0.1 for backups/admin).
name: umrah-connect

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umrah_connects}
      POSTGRES_USER: ${POSTGRES_USER:-umrah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --data-checksums
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=16GB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  api:
    image: ${API_IMAGE:-umrah-connect-api:latest}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-umrah}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-umrah_connects}?schema=public&connection_limit=20
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Only used when STORAGE_DRIVER=local (with STORAGE_LOCAL_PERSISTENT=true).
      - uploads:/app/platform/api/uploads
    expose:
      - "4000"
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging: *logging

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks: [internal]
    logging: *logging

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
