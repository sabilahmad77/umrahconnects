# API quality gate: typecheck, lint, unit + security e2e tests against PostgreSQL,
# provider contract tests against the official stand-ins, production build and
# container build. Deployments must only use commits that pass.
name: api-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: umrah
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: umrah_connects_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U umrah -d umrah_connects_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://umrah:ci-only-password@localhost:5432/umrah_connects_test
      DATABASE_URL: postgresql://umrah:ci-only-password@localhost:5432/umrah_connects_test
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @umrah-connects/api...
      - run: pnpm --filter @umrah-connects/api exec prisma generate
      - name: Migrations apply cleanly and the schema matches them
        working-directory: platform/api
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: pnpm --filter @umrah-connects/api typecheck
      - run: pnpm --filter @umrah-connects/api lint
      - run: pnpm --filter @umrah-connects/api exec vitest run
      - run: pnpm --filter @umrah-connects/api exec vitest run --config vitest.e2e.config.ts
      - run: pnpm --filter @umrah-connects/api build
      - name: Production container builds
        run: docker build -t umrah-connect-api:ci .

  # Provider code paths (Stripe SDK, S3/R2 storage driver, SMTP mail) against the
  # official stand-ins. They live outside the e2e job because they need containers
  # with their own commands, which `services:` cannot express. PROVIDER_TESTS_REQUIRED
  # makes a missing stand-in fail the job instead of skipping the suite (A12-6).
  providers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STRIPE_MOCK_URL: http://127.0.0.1:12111
      S3_TEST_ENDPOINT: http://127.0.0.1:19000
      S3_TEST_ACCESS_KEY: ucminioadmin
      S3_TEST_SECRET_KEY: ucminiosecret123
      SMTP_TEST_HOST: 127.0.0.1
      SMTP_TEST_PORT: "11025"
      SMTP_TEST_API: http://127.0.0.1:18025
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @umrah-connects/api...
      - run: pnpm --filter @umrah-connects/api exec prisma generate
      - name: Start the provider stand-ins
        run: |
          docker run -d --rm --name uc-stripe-mock -p 127.0.0.1:12111:12111 stripe/stripe-mock:latest
          docker run -d --rm --name uc-minio -p 127.0.0.1:19000:9000 \
            -e MINIO_ROOT_USER=ucminioadmin -e MINIO_ROOT_PASSWORD=ucminiosecret123 \
            minio/minio:latest server /data
          docker run -d --rm --name uc-mailpit -p 127.0.0.1:11025:1025 -p 127.0.0.1:18025:8025 \
            -e MP_SMTP_AUTH_ACCEPT_ANY=1 -e MP_SMTP_AUTH_ALLOW_INSECURE=1 axllent/mailpit:latest
      - run: pnpm --filter @umrah-connects/api test:providers
      - name: Stop the provider stand-ins
        if: always()
        run: docker stop uc-stripe-mock uc-minio uc-mailpit || true
